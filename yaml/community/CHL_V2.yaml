# File name patterns
# Note that if YYYY does not exist, then it is not a duplicated task
# These keys are mandatory:
#     - PATTERN
#     - PREFIX
#     - NX
#     - MT
#     - VV
FILE:
  PATTERN : "PREFIX_NX_MT_VV.nc"
  PREFIX  : ["CHL"]
  NX      : [2, 20]
  MT      : ["7D"]
  VV      : ["V2"]

# Folder structure for input and output
FOLDER:
  ORIGINAL    : "CHL/MERIS-ML"
  REPROCESSED : "CHL/MERIS-ML"
  TARBALL     : "CHL/MERIS-ML"

# Data configuration
# Note that the labels should match the PREFIX in FILE section
DATA:
  ABOUT          : "CHL dataset from Xu et al. (2022) (https://doi.org/10.1016/j.isprsjprs.2022.08.003)"
  CHANGE_LOGS    : ["Converting tif to nc", "Combine individual files as one", "Regridded from 20X if not 20X"]
  LABEL          : ["CHL"]
  LIMITS         : [0, 100]
  REV_LAT        : True
  SCALING        : "linear"
  SCALING_FACTOR : [0.1, 0]
  UNIT           : "μg cm⁻²"
  VERIFY_ONCE    : True

# GriddingMachine configuration
GRIDDINGMACHINE:
  TAG : CHL
